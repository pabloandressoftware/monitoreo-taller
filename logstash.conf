# Lee el archivo que escribe el exporter "file" del Colector (OTLP/JSON) y lo aplana para Elasticsearch.
input {
  file {
    path => "/var/log/otel-collector.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  json { source => "message" }

  # Una línea del Colector = resourceLogs[] > scopeLogs[] > logRecords[]: un evento por LogRecord
  split { field => "resourceLogs" }
  split { field => "[resourceLogs][scopeLogs]" }
  split { field => "[resourceLogs][scopeLogs][logRecords]" }

  ruby {
    code => '
      (event.get("[resourceLogs][resource][attributes]") || []).each do |a|
        v = a["value"] || {}
        val = v["stringValue"] || v["intValue"] || v["boolValue"]
        event.set("[service][name]", val) if a["key"] == "service.name"
        event.set("[deployment][environment]", val) if a["key"] == "deployment.environment"
      end
      rec = event.get("[resourceLogs][scopeLogs][logRecords]") || {}
      event.set("[log][level]", rec["severityText"])
      event.set("message", (rec["body"] || {})["stringValue"])
      event.set("traceId", rec["traceId"]) if rec["traceId"] && !rec["traceId"].empty?
      event.set("spanId", rec["spanId"]) if rec["spanId"] && !rec["spanId"].empty?
      (rec["attributes"] || []).each do |a|
        v = a["value"] || {}
        val = v["stringValue"] || v["intValue"] || v["boolValue"]
        event.set("[process][thread][name]", val) if a["key"] == "thread.name"
      end
      scope = event.get("[resourceLogs][scopeLogs][scope][name]")
      event.set("[log][logger]", scope) if scope
      ns = rec["timeUnixNano"].to_i
      event.set("@timestamp", LogStash::Timestamp.at(ns / 1_000_000_000.0)) if ns > 0
    '
  }

  mutate { remove_field => ["resourceLogs", "path", "host", "event", "@version"] }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "otel-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => dots }
}
