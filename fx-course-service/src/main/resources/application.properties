spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.application.name=fx-course-service
server.port=8001
eureka.client.service-url.defaultZone: http://localhost:8761/eureka/

# --- OpenTelemetry (API / SDK): trazas + logs por OTLP gRPC al Colector (Guía 3) ---
otel.service.name=fx-course-service
otel.exporter.otlp.endpoint=http://localhost:4319

# --- Monitoreo: Actuator + métricas de Micrometer exportadas por OTLP al Colector ---
management.endpoints.web.exposure.include=health,metrics
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=http://localhost:4320/v1/metrics
management.otlp.metrics.export.step=10s
management.otlp.metrics.export.base-time-unit=seconds
management.otlp.metrics.export.resource-attributes.service.name=${spring.application.name}
management.otlp.metrics.export.resource-attributes.deployment.environment=taller
